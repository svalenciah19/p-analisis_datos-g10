name: CI/CD - Extraccion de datos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Botón "Run workflow": despliega y lanza una extracción inmediata en Azure
  # La ejecución diaria (7:00 a.m. Colombia) la programa el Container Apps Job en Azure.

permissions:
  contents: read

env:
  AZURE_CLIENT_ID: 12708768-ab2c-4328-9a8a-ad72937a1bd6        # identidad id-gh-p-analisis-dev-44e9
  AZURE_TENANT_ID: 1dc9b339-fadb-432e-86df-423c38a0fcb8
  AZURE_SUBSCRIPTION_ID: a7c9765d-ccb3-436d-aa12-9c84f0a93862
  AZURE_RESOURCE_GROUP: rg-p-analisis-dev-44e9
  AZURE_ACR_NAME: crpanalisisdev44e9
  AZURE_JOB_NAME: caj-p-analisis-dev-44e9
  IMAGE_NAME: extraccion

concurrency:
  group: extraccion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    name: CI - Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest -v

  despliegue-azure:
    name: CD - Desplegar en Azure Container Apps
    needs: pruebas
    # Solo despliega en push a main o ejecución manual (no en pull requests)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write  # Necesario para el login OIDC con Azure (sin contraseñas guardadas)
    steps:
      - uses: actions/checkout@v4

      # Identificadores públicos (no son secretos): OIDC solo acepta tokens de este repo y del entorno 'test'
      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Construir imagen en Azure Container Registry
        run: |
          az acr build --registry "$AZURE_ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}" --image "$IMAGE_NAME:latest" .

      - name: Actualizar el Container Apps Job con la nueva imagen
        run: |
          az containerapp job update --name "$AZURE_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Ejecutar la extracción ahora (solo con Run workflow)
        if: github.event_name == 'workflow_dispatch'
        run: |
          az containerapp job start --name "$AZURE_JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP"
